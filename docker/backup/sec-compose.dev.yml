name: gofr-sec-dev

services:
  keycloak:
    build:
      context: ..
      dockerfile: docker/keycloak/Dockerfile.dev
    image: gofr-keycloak-dev:latest
    container_name: gofr-sec-keycloak
    hostname: gofr-sec-keycloak
    restart: unless-stopped
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${GOFR_SEC_DEV_KEYCLOAK_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${GOFR_SEC_DEV_KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_ENABLED: "true"
    ports:
      - "${GOFR_SEC_DEV_KEYCLOAK_PORT:-18080}:8080"
    networks:
      - gofr-net

  vault:
    build:
      context: ..
      dockerfile: docker/vault/Dockerfile.dev
    image: gofr-vault-dev:latest
    container_name: gofr-sec-vault
    hostname: gofr-sec-vault
    restart: unless-stopped
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_ADDR: http://127.0.0.1:8200
      VAULT_API_ADDR: http://gofr-sec-vault:8200
      VAULT_DEV_ROOT_TOKEN_ID: ${GOFR_SEC_DEV_VAULT_TOKEN:-gofr-dev-root-token}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
      SKIP_SETCAP: "true"
    ports:
      - "${GOFR_SEC_DEV_VAULT_PORT:-8306}:8200"
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s
    networks:
      - gofr-net

networks:
  gofr-net:
    external: true
    name: gofr-net